name: M3.2 independent verifier checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
    tags: ['blockchain-v0.3.2-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3-2-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: m3-2-offline-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - name: Accepted API dependencies
        run: python -m pip install --requirement services/api/requirements.lock
      - name: Offline verifier suites only — no database or chain startup
        run: |
          python scripts/test-m3-2-hash-oracle.py
          python scripts/test-m3-2-joint.py
          python scripts/test-m3-2-runner-recovery.py
          python scripts/test-m3-2-scenario.py
