name: Blockchain verification

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
    tags: ['blockchain-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blockchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: blockchain-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.4
      - name: Verify contracts, tests and generated ABIs
        run: bash scripts/check-blockchain.sh
