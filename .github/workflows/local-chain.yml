name: Local Anvil deployment verification

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
    tags: ['blockchain-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: local-chain-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.4
      - name: Build unchanged accepted contracts
        run: forge build
      - name: Verify M2 technical snapshot
        run: sha256sum -c docs/baselines/blockchain-m2-v2-rc.1.sha256
      - name: Verify local lifecycle and isolated live deployments
        run: python3 scripts/test-local-chain.py --live
