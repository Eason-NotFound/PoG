name: API and database verification

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: api-postgresql-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_USER: pog_api
          POSTGRES_PASSWORD: pog_api_ci_only
          POSTGRES_DB: pog_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pog_api -d pog_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      POG_TEST_TARGET_CONFIRMED: github-actions
      POG_DATABASE_URL: postgresql+psycopg://pog_api:pog_api_ci_only@127.0.0.1:5432/pog_api_test
      POG_TEST_DATABASE_URL: postgresql+psycopg://pog_api:pog_api_ci_only@127.0.0.1:5432/pog_api_test
      POG_STORAGE_ROOT: ${{ github.workspace }}/.local/ci-storage
      POG_A1_RUN_ID: a1-ci-run
      POG_A1_INSTANCE_ID: a1-ci-instance
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - name: Install exact Python dependencies
        run: |
          python -m pip install --requirement services/api/requirements.lock
          python -m pip check
          python -c 'import importlib.metadata as m; assert m.version("greenlet") == "3.5.6"'
      - name: Migrate empty PostgreSQL and run integration tests
        working-directory: services/api
        run: |
          alembic upgrade head
          python -m pytest tests unit_tests

  a2-live:
    name: api-a2-postgresql-anvil-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_USER: pog_api
          POSTGRES_PASSWORD: pog_api_ci_only
          POSTGRES_DB: pog_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pog_api -d pog_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      POG_TEST_TARGET_CONFIRMED: github-actions
      POG_DATABASE_URL: postgresql+psycopg://pog_api:pog_api_ci_only@127.0.0.1:5432/pog_api_test
      POG_TEST_DATABASE_URL: postgresql+psycopg://pog_api:pog_api_ci_only@127.0.0.1:5432/pog_api_test
      POG_A2_LIVE_MANIFEST: /tmp/pog-local-a2-api/manifest.json
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.4
      - name: Install exact Python dependencies and build accepted contracts
        run: |
          python -m pip install --requirement services/api/requirements.lock
          python -m pip check
          forge build
      - name: Migrate PostgreSQL and start isolated A2 chain
        run: |
          (cd services/api && alembic upgrade head)
          python3 scripts/local-chain.py up --port 18545 --state-dir /tmp/pog-local-a2-api
          python3 scripts/local-chain.py verify --port 18545 --state-dir /tmp/pog-local-a2-api
      - name: Run A2 path, typed vectors, and reorg recovery
        run: python -m pytest services/api/live_tests/test_a2_receipt_confirmed.py
      - name: Stop isolated A2 chain
        if: always()
        run: python3 scripts/local-chain.py stop --port 18545 --state-dir /tmp/pog-local-a2-api
